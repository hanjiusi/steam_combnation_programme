<!doctype html>
<html lang="zh-CN" data-theme="lemonade">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f9e8">
  <meta name="description" content="Steam 画像 × 推荐协同演示站：一个地址浏览标签画像、多目标推荐与项目报告。">
  <title>Steam 画像 × 推荐 · 协同演示站</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lemonade-components.css"><link rel="stylesheet" href="styles.css">
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;flex-direction:column;background:var(--bg,#f5f9e8);color:var(--ink,#293820);font:15px/1.6 "Microsoft YaHei","Segoe UI","PingFang SC",sans-serif}
    .site-header{display:flex;align-items:center;gap:32px;height:64px;flex:0 0 auto;max-width:1180px;width:100%;margin:0 auto;border-bottom:1px solid var(--line,#d1d7bd);padding:0 10px}
    .header-nav{display:flex;gap:26px;height:100%;align-items:center;font-size:13.5px}
    .header-nav a{text-decoration:none;color:var(--muted,#667052);display:flex;align-items:center;height:100%;position:relative}
    .header-nav a.current{color:var(--ink,#293820);font-weight:650}
    .header-nav a.current:after{content:"";position:absolute;height:3px;background:var(--mint,#4c7c24);bottom:0;width:100%}
    .header-meta{margin-left:auto;font-size:12px;color:var(--muted,#667052);white-space:nowrap}
    main{flex:1;min-height:0}
    main iframe{width:100%;height:100%;border:0;display:block}
    @media(max-width:760px){.site-header{gap:16px;padding:0 16px}.header-meta{display:none}}
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="header-nav" aria-label="页面导航" role="tablist">
      <a href="#reco" data-tab-link="reco" role="tab" aria-selected="true">推荐演示</a>
      <a href="#profile" data-tab-link="profile" role="tab" aria-selected="false">画像</a>
      <a href="report.html">项目报告</a>
    </nav>
    <div class="header-meta">一个地址浏览全部 · 画像 / 推荐 / 报告</div>
  </header>
  <main>
    <iframe id="frame-reco" data-src="reco.html" title="推荐实验室"></iframe>
    <iframe id="frame-profile" data-src="profile.html" title="游戏偏好画像" style="display:none"></iframe>
  </main>
  <script>
    (function () {
      var frames = { reco: document.getElementById('frame-reco'), profile: document.getElementById('frame-profile') };
      var links = document.querySelectorAll('[data-tab-link]');
      function apply() {
        var tab = location.hash === '#profile' ? 'profile' : 'reco';
        Object.keys(frames).forEach(function (key) {
          var frame = frames[key];
          if (key === tab) {
            if (!frame.getAttribute('src')) frame.setAttribute('src', frame.getAttribute('data-src'));
            frame.style.display = 'block';
          } else {
            frame.style.display = 'none';
          }
        });
        links.forEach(function (link) {
          var on = link.getAttribute('data-tab-link') === tab;
          link.classList.toggle('current', on);
          link.setAttribute('aria-selected', String(on));
        });
      }
      window.addEventListener('hashchange', apply);
      apply();
    })();
  </script>
</body>
</html>
